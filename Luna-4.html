<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#4f46e5"/>
  <title>Luna - Smart Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      padding-bottom: 40px;
    }

    /* Header */
    .header { text-align: center; color: white; margin-bottom: 22px; }
    .moon { font-size: 52px; line-height: 1; animation: glow 2s ease-in-out infinite; }
    .header h1 { font-size: 42px; font-weight: 900; letter-spacing: 3px; margin: 4px 0 2px; }
    .header p { font-size: 14px; opacity: 0.8; margin-bottom: 8px; }
    .status-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
      transition: all 0.4s ease;
    }
    .status-text { font-size: 13px; opacity: 0.9; }

    /* Message box */
    .message-box {
      background: white; border-radius: 16px;
      padding: 18px 20px; margin-bottom: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      min-height: 64px; display: flex;
      align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .message-box p { font-size: 16px; color: #333; text-align: center; line-height: 1.6; }

    /* Mic button */
    .mic-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
    .mic-btn {
      width: 110px; height: 110px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      box-shadow: 0 8px 30px rgba(79,172,254,0.5);
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      box-shadow: 0 0 40px rgba(245,87,108,0.8);
      transform: scale(1.1);
      animation: pulse 1s infinite;
    }
    .mic-btn svg { width: 52px; height: 52px; }
    .mic-label { color: white; margin-top: 12px; font-size: 14px; opacity: 0.85; }

    /* Device grid */
    .devices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .device-btn {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 18px; padding: 22px 10px;
      color: white; cursor: pointer; transition: all 0.3s ease;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
    }
    .device-btn.on { border: none; transform: scale(1.03); }
    .device-emoji { font-size: 36px; }
    .device-name { font-size: 14px; font-weight: 700; }
    .device-status {
      font-size: 11px; opacity: 0.85;
      background: rgba(255,255,255,0.15);
      padding: 2px 12px; border-radius: 20px;
    }
    .device-btn.on .device-status { background: rgba(0,0,0,0.2); }

    /* All controls */
    .all-controls { display: flex; gap: 12px; margin-bottom: 14px; }
    .all-btn {
      flex: 1; border: none; border-radius: 14px;
      padding: 16px; color: white; font-weight: 700;
      font-size: 15px; cursor: pointer; transition: all 0.3s ease;
    }
    .all-on { background: linear-gradient(135deg, #84fab0, #08aeea); box-shadow: 0 4px 15px rgba(8,174,234,0.3); }
    .all-off { background: linear-gradient(135deg, #fa709a, #fee140); box-shadow: 0 4px 15px rgba(250,112,154,0.3); }

    /* Settings */
    .settings-btn {
      width: 100%; background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px; padding: 13px; color: white;
      font-size: 13px; cursor: pointer; transition: all 0.3s ease;
    }
    .settings-panel {
      margin-top: 12px; background: white;
      border-radius: 14px; padding: 16px;
      display: none;
    }
    .settings-panel.open { display: block; animation: slideDown 0.3s ease; }
    .settings-panel label { font-weight: 700; font-size: 13px; color: #333; display: block; margin-bottom: 8px; }
    .settings-panel input {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 2px solid #e5e7eb; font-family: monospace;
      font-size: 14px;
    }
    .settings-panel small { color: #888; font-size: 11px; margin-top: 6px; display: block; }

    /* Animations */
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.4); }
      50% { text-shadow: 0 0 35px rgba(255,255,255,0.9); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1.1); }
      50% { transform: scale(1.18); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .fade-in { animation: fadeIn 0.4s ease; }

    /* Active press effect */
    .device-btn:active { transform: scale(0.97) !important; }
    .all-btn:active { transform: scale(0.97); }
    .mic-btn:active { transform: scale(0.93) !important; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="moon">🌙</div>
  <h1>Luna</h1>
  <p>Your Smart Home Assistant</p>
  <div>
    <span class="status-dot" id="statusDot" style="background:#f87171;"></span>
    <span class="status-text" id="statusText">Offline — Turn on hotspot</span>
  </div>
</div>

<!-- Message -->
<div class="message-box">
  <p id="lunaMsg">Hey there! I'm Luna 🌙</p>
</div>

<!-- Mic -->
<div class="mic-section">
  <button class="mic-btn" id="micBtn" onclick="handleVoice()">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <p class="mic-label" id="micLabel">Tap to speak to Luna</p>
</div>

<!-- Devices -->
<div class="devices" id="devicesGrid"></div>

<!-- All controls -->
<div class="all-controls">
  <button class="all-btn all-on" onclick="controlAll(true)">🟢 All ON</button>
  <button class="all-btn all-off" onclick="controlAll(false)">🔴 All OFF</button>
</div>

<!-- Settings -->
<button class="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
<div class="settings-panel" id="settingsPanel">
  <label>NodeMCU IP Address:</label>
  <input type="text" id="ipInput" value="192.168.43.150" oninput="nodeIP=this.value"/>
  <small>Fixed IP: 192.168.43.150 — Only change if you re-upload code with different IP.</small>
</div>

<script>
  // ============================================
  // LUNA SMART HOME - Configuration
  // ============================================
  let nodeIP = "192.168.43.150";
  let deviceStates = { 1: false, 2: false, 3: false, 4: false };
  let isConnected = false;
  let settingsOpen = false;

  const DEVICES = {
    1: { name: "Main Light",   emoji: "💡", color: "#FFD700", keywords: ["light","bulb","main light","main"] },
    2: { name: "Fan",          emoji: "🌀", color: "#4A9EFF", keywords: ["fan"] },
    3: { name: "Socket Board", emoji: "🔌", color: "#FF6B6B", keywords: ["socket","charger","plug","board"] },
    4: { name: "Table Light",  emoji: "🕯️", color: "#9D84FF", keywords: ["table","soft","table light","soft light","desk"] },
  };

  const RESPONSES = {
    on:      ["You got it, boss! {d} is ON! ✨","Done! {d} powered up! ⚡","{d} is ON! Anything else? 😊","Turning on {d} for you! 💫"],
    off:     ["{d} is OFF! Hope you're not scared of the dark 😏","Powered down {d}! 🌙","Alright, {d} OFF! ✓","Lights out for {d}! 😴"],
    all_on:  ["Everything's ON! Party time! 🎉","Full power mode! ⚡⚡","All devices ON, boss! 💪"],
    all_off: ["All OFF! Time to sleep? 😴","Saving energy! 🌱","Goodnight mode! 🌙✨"],
    error:   ["Can't reach devices 😅 Check hotspot?","Connection issue... Try again? 🤔"],
    listen:  ["I'm listening... 👂","Go ahead, I'm all ears! 👂"],
    connect: ["Hey! I'm online and ready! 🚀","Connected! Your home is now smart! 🏠✨"],
    offline: ["I'm offline 😴 Turn on hotspot first!"],
    nodev:   ["Which device? Say fan, light, socket, or table light 🤔"],
  };

  function pick(type, d="") {
    const arr = RESPONSES[type];
    return arr[Math.floor(Math.random()*arr.length)].replace("{d}", d);
  }

  function setMsg(text) {
    const el = document.getElementById("lunaMsg");
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = text; el.style.opacity = 1; el.style.transition = "opacity 0.3s"; }, 150);
  }

  // ============================================
  // Device Grid - Build UI
  // ============================================
  function buildGrid() {
    const grid = document.getElementById("devicesGrid");
    grid.innerHTML = "";
    for (const [id, dev] of Object.entries(DEVICES)) {
      const on = deviceStates[id];
      const btn = document.createElement("button");
      btn.className = "device-btn" + (on ? " on" : "");
      btn.id = "dev-" + id;
      btn.style.background = on
        ? `linear-gradient(135deg, ${dev.color}cc, ${dev.color})`
        : "rgba(255,255,255,0.12)";
      btn.style.boxShadow = on ? `0 6px 20px ${dev.color}55` : "none";
      btn.innerHTML = `
        <span class="device-emoji">${dev.emoji}</span>
        <span class="device-name">${dev.name}</span>
        <span class="device-status">${on ? "ON" : "OFF"}</span>
      `;
      btn.onclick = () => control(parseInt(id), !deviceStates[id]);
      grid.appendChild(btn);
    }
  }

  function updateDeviceUI(id, on) {
    deviceStates[id] = on;
    const btn = document.getElementById("dev-" + id);
    if (!btn) return;
    const dev = DEVICES[id];
    btn.className = "device-btn" + (on ? " on" : "");
    btn.style.background = on
      ? `linear-gradient(135deg, ${dev.color}cc, ${dev.color})`
      : "rgba(255,255,255,0.12)";
    btn.style.boxShadow = on ? `0 6px 20px ${dev.color}55` : "none";
    btn.querySelector(".device-status").textContent = on ? "ON" : "OFF";
  }

  // ============================================
  // Connection
  // ============================================
  async function pingDevice() {
    try {
      const r = await fetch(`http://${nodeIP}/status`, { signal: AbortSignal.timeout(3000) });
      const d = await r.json();
      if (d.connected) {
        if (!isConnected) {
          setMsg(pick("connect"));
          document.getElementById("statusDot").style.background = "#4ade80";
          document.getElementById("statusDot").style.boxShadow = "0 0 8px #4ade80";
          document.getElementById("statusText").textContent = "Connected";
        }
        isConnected = true;
        [1,2,3,4].forEach(i => updateDeviceUI(i, d["relay"+i]));
      }
    } catch {
      if (isConnected) {
        document.getElementById("statusDot").style.background = "#f87171";
        document.getElementById("statusDot").style.boxShadow = "none";
        document.getElementById("statusText").textContent = "Offline — Turn on hotspot";
      }
      isConnected = false;
    }
  }

  // ============================================
  // Control
  // ============================================
  async function control(id, on) {
    try {
      await fetch(`http://${nodeIP}/control?device=${id}&state=${on?"on":"off"}`);
      updateDeviceUI(id, on);
      setMsg(pick(on?"on":"off", DEVICES[id].name));
    } catch {
      setMsg(pick("error"));
    }
  }

  async function controlAll(on) {
    try {
      await fetch(`http://${nodeIP}/${on?"allon":"alloff"}`);
      [1,2,3,4].forEach(i => updateDeviceUI(i, on));
      setMsg(pick(on?"all_on":"all_off"));
    } catch {
      setMsg(pick("error"));
    }
  }

  // ============================================
  // Voice Control
  // ============================================
  function handleVoice() {
    if (!isConnected) { setMsg(pick("offline")); return; }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setMsg("Voice not supported here. Please open in Chrome browser! 🌐");
      return;
    }

    const rec = new SR();
    rec.lang = "en-IN";
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    const micBtn = document.getElementById("micBtn");
    const micLabel = document.getElementById("micLabel");

    micBtn.classList.add("listening");
    micLabel.textContent = "Listening...";
    setMsg(pick("listen"));

    rec.onresult = (e) => {
      const cmd = e.results[0][0].transcript.toLowerCase();
      micBtn.classList.remove("listening");
      micLabel.textContent = "Tap to speak to Luna";
      processCommand(cmd);
    };

    rec.onerror = () => {
      micBtn.classList.remove("listening");
      micLabel.textContent = "Tap to speak to Luna";
      setMsg("Didn't catch that! Try again? 🤔");
    };

    rec.onend = () => {
      micBtn.classList.remove("listening");
      micLabel.textContent = "Tap to speak to Luna";
    };

    rec.start();
  }

  function processCommand(cmd) {
    const isOn  = cmd.includes("on")  && !cmd.includes("off");
    const isOff = cmd.includes("off") && !cmd.includes("on");
    const isAll = cmd.includes("all") || cmd.includes("every") || cmd.includes("everything");

    if (isAll) {
      if (isOff) { controlAll(false); return; }
      if (isOn)  { controlAll(true);  return; }
    }

    const found = [];
    for (const [id, dev] of Object.entries(DEVICES)) {
      if (dev.keywords.some(k => cmd.includes(k))) found.push(parseInt(id));
    }

    if (found.length > 0) {
      const turnOn = !isOff;
      found.forEach(id => control(id, turnOn));
      if (found.length > 1) {
        const names = found.map(id => DEVICES[id].name).join(", ");
        setMsg(`Handling: ${names}! 🎉`);
      }
    } else {
      setMsg(pick("nodev"));
    }
  }

  // ============================================
  // Settings toggle
  // ============================================
  function toggleSettings() {
    settingsOpen = !settingsOpen;
    const panel = document.getElementById("settingsPanel");
    panel.classList.toggle("open", settingsOpen);
    document.querySelector(".settings-btn").textContent =
      (settingsOpen ? "⚙️ Hide Settings" : "⚙️ Settings");
  }

  // ============================================
  // Init
  // ============================================
  buildGrid();
  pingDevice();
  setInterval(pingDevice, 5000);
</script>
</body>
</html>
